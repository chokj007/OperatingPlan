<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Operating Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Operating Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,a,input,textarea{touch-action:manipulation}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: left rail (board, closes, calendar, rules, then the nine tracks in two priority tiers) beside one working page. Each track owns one hue everywhere it appears. */
:root{
  --paper:#f2f3f7; --card:#ffffff; --ink:#1b2030; --mute:#586074; --line:#dcdfe8; --soft:#e9ebf2;
  --good:#1f8a5b; --warn:#a85f00; --bad:#c62828;
  --apps:#3f51b5; --outreach:#00897b; --nespresso:#e64a19; --portfolio:#2e9e6b; --deck:#c98a00;
  --product:#8e24aa; --publication:#ad1457; --skills:#0288d1; --painting:#d9567f; --lab:#6d4c41; --tier2:#7e57c2; --plan:#546e7a;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
  --mono:'Neue Haas Grotesk Text Pro','Neue Haas Grotesk Text','Neue Haas Grotesk Display Pro','Neue Haas Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141a; --card:#1a1d27; --ink:#e9ebf2; --mute:#9aa1b4; --line:#2b3040; --soft:#232736;
    --good:#4cc38a; --warn:#e5a63c; --bad:#ff7b7b;
    --apps:#8c9eff; --outreach:#4db6ac; --nespresso:#ff8a65; --portfolio:#5fd3a0; --deck:#ffca28;
    --product:#ce93d8; --publication:#f48fb1; --skills:#4fc3f7; --painting:#f48fb1; --lab:#bcaaa4; --tier2:#b39ddb; --plan:#90a4ae;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12141a; --card:#1a1d27; --ink:#e9ebf2; --mute:#9aa1b4; --line:#2b3040; --soft:#232736;
  --good:#4cc38a; --warn:#e5a63c; --bad:#ff7b7b;
  --apps:#8c9eff; --outreach:#4db6ac; --nespresso:#ff8a65; --portfolio:#5fd3a0; --deck:#ffca28;
  --product:#ce93d8; --publication:#f48fb1; --skills:#4fc3f7; --painting:#f48fb1; --lab:#bcaaa4; --tier2:#b39ddb; --plan:#90a4ae;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.shell{max-width:1320px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.015em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* track hues */
.t-apps{--c:var(--apps);--m:68%}.t-outreach{--c:var(--outreach);--m:66%}.t-nespresso{--c:var(--nespresso);--m:60%}
.t-portfolio{--c:var(--portfolio);--m:62%}.t-deck{--c:var(--deck);--m:46%}.t-product{--c:var(--product);--m:68%}
.t-publication{--c:var(--publication);--m:66%}.t-skills{--c:var(--skills);--m:62%}.t-painting{--c:var(--painting);--m:62%}.t-lab{--c:var(--lab);--m:62%}
.t-tier2{--c:var(--tier2);--m:66%}.t-plan{--c:var(--plan);--m:70%}.t-none{--c:var(--mute);--m:70%}
.tint{background:color-mix(in srgb,var(--c) 14%,var(--card));color:color-mix(in srgb,var(--c) var(--m),var(--ink));border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:18px}
.top .sub{color:var(--mute);margin-top:6px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chipbtn[aria-pressed="true"],.chipbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.status{font-family:var(--mono);font-size:12px;color:var(--mute)}

.frame{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.tabs .grp{margin:16px 0 6px 10px}
.tabs .grp:first-child{margin-top:0}
.tabs a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--mute);font-weight:500}
.tabs a:hover{background:var(--soft);color:var(--ink)}
.tabs a.on{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 9px}
.tabs .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel > .label{display:block;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cols > *{min-width:0}
.muted{color:var(--mute)}
.pagehead{border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.pagehead h1{color:color-mix(in srgb,var(--c) var(--m),var(--ink))}
.pagehead p{max-width:62ch;color:var(--ink)}
.prog{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--card));overflow:hidden;max-width:320px}
.prog i{display:block;height:100%;background:var(--c)}
.weekpick{display:flex;flex-wrap:wrap;gap:6px}
.scrollrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scrollrow .chipbtn{flex:none;white-space:nowrap}
.note{border-radius:10px;padding:10px 12px;background:var(--soft);font-size:14px}
.note b{font-weight:600}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}

/* verdict + kpis */
.verdict{border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--card)}
.verdict .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.verdict.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.verdict.good .v{color:var(--good)}
.verdict.ok .v{color:var(--warn)}
.verdict.ok{border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.verdict.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.verdict.bad .v{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--display);font-size:32px;line-height:1.05}
.kpi small{color:var(--mute);font-size:12.5px}

/* sprint rows */
.sprint{display:flex;flex-direction:column}
.sgrp{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 6px}
.sr{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(90px,1.4fr) 196px;gap:6px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sr:first-of-type{border-top:0}
.sr .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.sr .nm a{display:flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;color:color-mix(in srgb,var(--c) var(--m),var(--ink))}
.sr .nm span.h{font-size:12.5px;color:var(--mute);padding-left:18px}
.meter{position:relative;height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,var(--card))}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c)}
.meter u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ctl b{font-family:var(--display);font-size:24px;min-width:2ch;text-align:center;line-height:1}
.ctl .of{font-family:var(--mono);font-size:12px;color:var(--mute);min-width:3.5ch}
.step{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;flex:none}
.step:hover{background:var(--soft)}
.step.wide{width:auto;padding:0 10px;border-radius:99px;font-size:13px;font-family:var(--mono)}
.sr.off{opacity:.5}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--c,var(--ink))}
.item .ph{width:18px;height:18px}
.item .t{font-weight:600}
.item.done .t{color:var(--mute);text-decoration:line-through}
.item.dropped .t{color:var(--mute);text-decoration:line-through}
.item .d{color:var(--mute);font-size:13.5px}
.when{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-top:4px}
.pill.over{color:var(--bad);border-color:currentColor}.pill.today{color:var(--warn);border-color:currentColor}.pill.soon{color:var(--ink);border-color:var(--ink)}.pill.ok{color:var(--good);border-color:currentColor}
.proj{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--ink)}
.grouph{margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--mute);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--mute);margin-left:6px;vertical-align:1px}
.tag.hard{background:var(--ink);color:var(--paper)}

/* forms */
input[type=text],input[type=date],input[type=url],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.lined{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,var(--line) 23px,var(--line) 24px);background-color:var(--card);line-height:24px;padding-block:6px}
.form{display:flex;flex-wrap:wrap;gap:8px}
.form input[type=text]{flex:1 1 180px;width:auto}
.form input[type=date]{flex:0 1 150px;width:auto}
.slip{margin-top:8px;padding:12px;border-radius:10px;background:var(--soft)}
.slip .lead{flex:1 1 100%;font-size:13.5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.linkrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0}
.linkrow a{overflow-wrap:anywhere}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.table th{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:400;border-top:0}
.scroll{overflow-x:auto}

/* pace chips (track pages) */
.pace{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.pace > div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;font-size:12px}
.pace .w{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.pace b{font-family:var(--display);font-size:16px}
.pace .on{border-color:var(--ink)}
.pace .hit{background:color-mix(in srgb,var(--good) 12%,var(--card))}
.pace .miss{background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.pace .fl{border-style:dashed}

/* calendar view */
.weekgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.day{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;align-content:start}
.day .dow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.day .dnum{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.day .dh{display:flex;flex-direction:column;gap:2px}
.day .items{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;min-width:0}
.blk strong{font-weight:600;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.blk .time{font-family:var(--mono);font-size:11.5px;opacity:.9}
.blk small{font-size:12.5px;opacity:.9}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.legend > div{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px}
.legend small{display:block;opacity:.85}
@media (min-width:1180px){
  .weekgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .day{grid-template-columns:minmax(0,1fr)}
  .day .dh{flex-direction:row;align-items:baseline;gap:8px}
}

/* rules */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.steps > div{background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.steps > div::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.foot{margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  input,textarea{font-size:16px}
  .frame{grid-template-columns:minmax(0,1fr);gap:16px}
  .tabs{flex-direction:row;overflow-x:auto;position:static;gap:4px;padding-bottom:6px;scrollbar-width:thin}
  .tabs .grp{display:none}
  .tabs a{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px}
  .tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tabs a.on .sw{outline:1px solid var(--paper)}
  .tabs .cnt{display:none}
  h1{font-size:26px}
}
@media (max-width:560px){
  .sr{grid-template-columns:minmax(0,1fr) auto}
  .sr .ctl{justify-content:flex-end}
  .sr .meter{grid-column:1 / -1;order:3}
  .day{grid-template-columns:minmax(0,1fr)}
  .day .dh{flex-direction:row;align-items:baseline;gap:8px}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .when{grid-column:2;text-align:left}
  .verdict .v{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){ .tabs a,.step,.chipbtn{transition:background .15s} .meter i{transition:width .25s} }

/* themed-day additions */
:root{--aw:#6f8f2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--aw:#aed581}}
:root[data-theme="dark"]{--aw:#aed581}
.t-aw{--c:var(--aw);--m:55%}
.verdict.tint{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:color-mix(in srgb,var(--c) 34%,transparent);color:color-mix(in srgb,var(--c) var(--m),var(--ink))}
.verdict.tint .v{color:inherit}
.verdict.tint .muted{color:inherit;opacity:.85}
.chipbtn.met{border-color:var(--good)}
.chipbtn.rest{opacity:.55}
.chipbtn[aria-pressed="true"].rest{opacity:1}
.item .t{overflow-wrap:anywhere}
</style>

</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="label">Nov 24, 2026 to Jan 31, 2027</div>
      <h1>Operating Plan</h1>
      <p class="sub" id="whereami"></p>
    </div>
  </header>
  <div class="frame">
    <nav class="tabs" id="tabs" aria-label="Plan sections"></nav>
    <main id="main"></main>
  </div>
  <div class="foot"><span class="status" id="saved"></span><span class="status">Days have themes, not clock times. The counts are the contract.</span></div>
</div>

<script>(function(){
'use strict';

/* ---------- dates ---------- */
var STANDALONE=true;
var PLAN_START=new Date(2026,10,23), WEEKS=10;      /* weeks run Monday to Sunday, first one starts Mon Nov 23 */
var LAUNCH=new Date(2026,10,24);                    /* first working day: Tue Nov 24 */
var DEALER_FROM=new Date(2026,11,7);                /* Fridays open up to dealer's choice from here */
var HOLIDAYS=['2026-11-26','2026-12-24','2026-12-25','2027-01-01'];
var OUT_GOAL=10, OUT_MIN=5, OUT_PER_DAY=10, APP_PER_DAY=1, APP_DAY_AIM=3;
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function md(d){return MON[d.getMonth()]+' '+d.getDate();}
function dlong(d){return DOW[d.getDay()]+' '+md(d);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function daysTo(d){return Math.round((d-today())/864e5);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function weekStart(i){return addDays(PLAN_START,7*i);}
function weekOf(d){var i=Math.floor((d-PLAN_START)/(7*864e5));return Math.max(0,Math.min(WEEKS-1,i));}
function uid(){return Math.random().toString(36).slice(2,9);}
function weekDays(i){var a=[];for(var k=0;k<7;k++)a.push(addDays(weekStart(i),k));return a;}
function eligible(d){var w=d.getDay();return w>=1&&w<=5&&d>=LAUNCH&&HOLIDAYS.indexOf(iso(d))<0;}

/* ---------- the plan ---------- */
var GROUPS=[{k:'main',n:'Main three'},{k:'later',n:'Later'},{k:'choice',n:"Dealer's choice"},{k:'protected',n:'Protected'}];
var TRACKS=[

function dayN(d,k){return dayRec(d)[k]||0;}
function focusKey(d){var t=themeOf(d);if(t==='choice')return dayRec(d).c||null;return t;}
function wsum(i,k){return weekDays(i).reduce(function(a,d){return a+dayN(d,k);},0);}
function outBar(i){return OUT_PER_DAY*weekDays(i).filter(eligible).length;}
function appBar(i){return APP_PER_DAY*weekDays(i).filter(eligible).length;}
function focusBar(i){return weekDays(i).filter(function(d){return eligible(d)&&d.getDay()<=4;}).length;}
function weekOver(i){return addDays(weekStart(i),6)<today();}
function weekFlag(i,k){return !!((S.wk[iso(weekStart(i))]||{})[k]);}
function streak(){
  var t=today(),c=0;
  for(var k=0;k<150;k++){var dd=addDays(t,-k);if(dd<LAUNCH)break;if(!eligible(dd))continue;if(dayN(dd,'o')>=OUT_MIN)c++;else if(k===0)continue;else break;}
  return c;
}
function weekResult(i){
  var o=wsum(i,'o'),a=wsum(i,'a'),f=wsum(i,'d'),ob=outBar(i),ab=appBar(i),fb=focusBar(i);
  var hit=(o>=ob?1:0)+(a>=ab?1:0)+(f>=fb?1:0),over=weekOver(i);
  var t,k;
  if(!over){t=hit===3?'On track, all three met':'In progress';k=hit===3?'good':'';}
  else if(hit===3){t='Week held';k='good';}
  else if(hit===2){t='Mostly held';k='ok';}
  else{t='Light week';k='ok';}
  return {o:o,a:a,f:f,ob:ob,ab:ab,fb:fb,hit:hit,over:over,t:t,k:k};
}

var LS='term-binder-v1';

function blank(){return {done:{},left:{},notes:{},links:{},extra:{},pipeline:[],apps:{},swaps:{},log:{},mode:{},slips:[],moved:{},dropped:{},scope:{},days:{},wk:{}};}
function norm(o){var b=blank();if(!o||typeof o!=='object')return b;Object.keys(b).forEach(function(k){if(o[k]!=null)b[k]=o[k];});if(!Array.isArray(b.pipeline))b.pipeline=[];if(!Array.isArray(b.slips))b.slips=[];return b;}
var mode='local',db=null,ref=null,saving=false,dirty=false,timer=null;
function setSaved(msg){var el=document.getElementById('saved');if(el)el.textContent=msg;}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)S=norm(JSON.parse(r));}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function touch(){
  dirty=true;saveLocal();
  setSaved(mode==='db'?'Saving...':'Saved on this device');
  clearTimeout(timer);timer=setTimeout(flush,600);
}
function flush(){
  if(mode!=='db'||!ref){dirty=false;return;}
  if(saving){timer=setTimeout(flush,300);return;}
  saving=true;var snapshot=JSON.stringify(S);dirty=false;
  ref.set(JSON.parse(snapshot)).then(function(){saving=false;setSaved('Saved to your plan');if(dirty)flush();})
   .catch(function(){saving=false;mode='local';setSaved('Saved on this device only');});
}
function initStore(){
  loadLocal();
  setSaved('Saved on this device');
  try{
    var c=window.claude;if(!c||!c.use)return;
    c.use('db').then(function(d){
      if(!d)return;db=d;ref=d.doc('term/state');mode='db';
      ref.onSnapshot(function(snap){
        if(snap.exists){
          var next=norm(snap.data());var j=JSON.stringify(next);
          if(dirty||saving||j===JSON.stringify(S))return;
          S=next;saveLocal();
          var a=document.activeElement;
          if(!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')))render();
        }else{ if(JSON.stringify(S)!==JSON.stringify(blank()))touch(); }
        setSaved('Saved to your plan');
      },function(){mode='local';setSaved('Saved on this device only');});
    }).catch(function(){});
  }catch(e){}
}

function autoState(m){
  var th=closeThrough(m.ci),tgt=cumTarget(m.kind,th),act=cumActual(m.kind,th),close=parse(m.date);
  var done=act>=tgt,st;
  if(done)st={k:'ok',t:'Hit'};
  else if(today()>close)st={k:'over',t:'Missed by '+(tgt-act)};
  else{var d=daysTo(close);st={k:d<=7?'soon':'',t:(tgt-act)+' to go, '+(d===0?'today':'in '+d+'d')};}
  return {done:done,act:act,tgt:tgt,th:th,st:st};
}
function isDone(m){return m.auto?autoState(m).done:!!S.done[m.id];}
function statusOf(m){
  if(isDropped(m))return {k:'',t:'Dropped'};
  if(m.auto)return autoState(m).st;
  if(S.done[m.id])return {k:'ok',t:'Done'};
  var diff=daysTo(parse(curDate(m)));
  if(diff<0)return {k:'over',t:'Overdue '+(-diff)+'d'};
  if(diff===0)return {k:'today',t:'Due today'};
  if(diff<=7)return {k:'soon',t:'In '+diff+'d'};
  return {k:'',t:'In '+diff+'d'};
}

/* ---------- routing and shell ---------- */
var ROUTES=[{k:'today',n:'Today',g:'Plan'},{k:'closes',n:'Closes',g:'Plan'},{k:'week',n:'The week',g:'Plan'},{k:'rules',n:'Rules',g:'Plan'},{k:'backup',n:'Backup',g:'Plan'}];
GROUPS.forEach(function(g){TRACKS.filter(function(t){return t.group===g.k;}).forEach(function(t){ROUTES.push({k:t.key,n:t.name,g:g.n,type:t.type});});});
function readHash(){var h=(location.hash||'').replace('#','');if(!h){try{h=localStorage.getItem(LS+'-route')||'';}catch(e){}}if(h==='board')h='today';if(h==='calendar')h='week';return ROUTES.some(function(r){return r.k===h;})?h:'today';}
function renderTabs(){
  var open={};MILESTONES.forEach(function(m){if(m.hard&&!isDone(m)&&!isDropped(m)&&parse(curDate(m))<=parse(CLOSES[nextClose().i]))open[m.track]=(open[m.track]||0)+1;});
  var html='',g='';

    if(r.g!==g){g=r.g;html+='<span class="label grp">'+esc(g)+'</span>';}
    html+='<a href="#'+r.k+'" class="'+(r.type?'t-'+r.type+' ':'')+(r.k===route?'on':'')+'"'+(r.k===route?' aria-current="page"':'')+'>'+(r.type?'<span class="sw"></span>':'')+esc(r.n)+(r.type&&open[r.k]?'<span class="cnt">'+open[r.k]+'</span>':'')+'</a>';
  });
  document.getElementById('tabs').innerHTML=html;
}
function renderPulse(){
  var t=today(),el=document.getElementById('whereami'),txt;
  var nc=nextClose(),cd=daysTo(parse(CLOSES[nc.i]));
  if(t<LAUNCH){txt='The plan starts '+dlong(LAUNCH)+'.';}
  else if(t>addDays(weekStart(WEEKS-1),6)){txt='The plan ended Sunday, Jan 31.';}
  else{var th=themeOf(t),fk=focusKey(t);txt='Week '+(weekOf(t)+1)+' of '+WEEKS+'. Today is '+dlong(t)+(th?(th==='choice'?(fk?'. Focus: '+fname(fk):(t>=DEALER_FROM?". Dealer's choice":'. Catch-up day')):'. Focus: '+fname(th)):'. Rest day')+'. '+CLOSE_NAME[nc.i]+(cd>=0?' in '+cd+' day'+(cd===1?'':'s'):'')+'.';}

function render(){
  route=readHash();
  var m=document.getElementById('main');var v;
  if(route==='today')v=viewToday();else if(route==='closes')v=viewCloses();else if(route==='week')v=viewWeek();else if(route==='rules')v=viewRules();else if(route==='backup')v=viewBackup();else v=viewTrack(route);
  m.innerHTML=backupBanner()+v;renderTabs();renderPulse();try{localStorage.setItem(LS+'-route',route);}catch(e){}
}

/* ---------- events ---------- */
function stamp(){return md(new Date());}
function copyText(id,msgId,after){
  var ta=document.getElementById(id),msg=document.getElementById(msgId);if(!ta)return;
  var ok=function(){if(after)after();if(msg)msg.textContent='Copied';};
  var fb=function(){try{ta.focus();ta.select();if(msg)msg.textContent='Selected. Copy it from the box.';}catch(e){}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok,fb);}else fb();}catch(e){fb();}
}
function dayObj(d){var k=iso(d);return S.days[k]=S.days[k]||{};}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a;
  if(a==='toggle'||a==='wkflag')return;
  if(a==='day'){curDay=parse(el.dataset.d);slipOpen=null;render();}
  else if(a==='wk'){curDay=addDays(dayNow(),7*(+el.dataset.dir));slipOpen=null;render();}
  else if(a==='bump'){var o=dayObj(dayNow()),k=el.dataset.k,cap=k==='o'?100:15;o[k]=Math.max(0,Math.min(cap,(o[k]||0)+(+el.dataset.dir)));touch();render();}
  else if(a==='focus'){var o2=dayObj(dayNow());o2.d=o2.d?0:1;touch();render();}
  else if(a==='choice'){var o3=dayObj(dayNow());o3.c=(o3.c===el.dataset.k)?'':el.dataset.k;touch();render();}
  else if(a==='slip'){slipOpen=el.dataset.id;render();}
  else if(a==='slipcancel'){slipOpen=null;render();}
  else if(a==='dellink'){var arr=S.links[el.dataset.p]||[];arr.splice(+el.dataset.i,1);S.links[el.dataset.p]=arr;touch();render();}
  else if(a==='pipecycle'){var r=S.pipeline[+el.dataset.i];r.s=((r.s||0)+1)%PIPE.length;touch();render();}
  else if(a==='pipedel'){S.pipeline.splice(+el.dataset.i,1);touch();render();}
  else if(a==='copybackup'){copyText('backup-out','bmsg',markBackup);}
  else if(a==='restorecancel'){armed=false;render();}
  else if(a==='restore'){
    var inp=document.getElementById('backup-in');var raw=inp?inp.value.trim():'';
    if(!raw){backupMsg='Paste a backup first.';armed=false;render();return;}
    if(!armed){armed=true;render();var ta2=document.getElementById('backup-in');if(ta2)ta2.value=raw;return;}
    var parsed;try{parsed=JSON.parse(raw);}catch(err){backupMsg='That did not look like a backup.';armed=false;render();return;}
    S=norm(parsed);armed=false;backupMsg='Restored.';touch();render();
  }
});
document.addEventListener('change',function(e){
  var el=e.target;if(!el.dataset)return;
  if(el.dataset.a==='toggle'){S.done[el.dataset.id]=el.checked;touch();render();}
  else if(el.dataset.a==='xtoggle'){var arr=S.extra[el.dataset.p]||[];arr.forEach(function(x){if(x.id===el.dataset.id)x.done=el.checked;});touch();render();}
  else if(el.dataset.a==='wkflag'){var wk=iso(weekStart(weekOf(dayNow())));var w=S.wk[wk]=S.wk[wk]||{};w[el.dataset.k]=el.checked;touch();render();}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var type=f.dataset.form,p=f.dataset.p,fd=new FormData(f);
  if(type==='task'){var t=String(fd.get('t')||'').trim();if(!t)return;(S.extra[p]=S.extra[p]||[]).push({id:'x'+uid(),t:t,d:String(fd.get('d')||''),done:false});}
  else if(type==='link'){var u=String(fd.get('u')||'').trim();if(!/^https?:\/\//i.test(u))return;(S.links[p]=S.links[p]||[]).push({l:String(fd.get('l')||'').trim(),u:u});}
  else if(type==='pipe'){var c=String(fd.get('c')||'').trim();if(!c)return;S.pipeline.unshift({id:uid(),c:c,s:0});}
  else if(type==='slip'){
    var id=f.dataset.id,m=MBY[id];if(!m)return;
    var why=String(fd.get('why')||'').trim(),to=String(fd.get('to')||''),scope=String(fd.get('scope')||'').trim(),cnt=slipsOf(id).length;
    var cur=parse(curDate(m));if(!why||!to)return;var nd=parse(to);if(!(nd>cur)||nd>addDays(cur,21))return;if(cnt===1&&!scope)return;
    S.slips.push({id:id,from:curDate(m),to:to,why:why,scope:scope,title:mTitle(m),at:stamp()});S.moved[id]=to;if(scope)S.scope[id]=scope;slipOpen=null;
  }
  else if(type==='drop'){
    var id2=f.dataset.id,m2=MBY[id2];if(!m2)return;var why2=String(fd.get('why')||'').trim();if(!why2)return;
    S.slips.push({id:id2,from:curDate(m2),to:'',why:why2,drop:1,title:mTitle(m2),at:stamp()});S.dropped[id2]=true;slipOpen=null;
  }
  touch();render();
});
var noteTimer=null;
document.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.note)return;
  var p=el.dataset.p;
  if(el.dataset.note==='left')S.left[p]={text:el.value,at:stamp()};
  else S.notes[p]=el.value;
  clearTimeout(noteTimer);noteTimer=setTimeout(touch,500);
});
window.addEventListener('hashchange',function(){slipOpen=null;render();});

function askPersist(){try{if(navigator.storage&&navigator.storage.persist&&navigator.storage.persisted){navigator.storage.persisted().then(function(ok){if(!ok)return navigator.storage.persist();}).catch(function(){});}}catch(e){}}
initStore();
if(STANDALONE)askPersist();
render();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
